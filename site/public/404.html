<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lost in shadow | Gnomon</title>
<meta name="description" content="This page is in permanent shadow. Head back to Gnomon, the lunar south pole landing-site navigator." />
<meta name="theme-color" content="#05060B" />
<link rel="icon" href="/lunar-landing-site-navigator/favicon.svg" type="image/svg+xml" />
<style>
  :root { --space: #05060B; --ink: #EDEAE2; --dim: #A3A09A; --sun: #F4B860; --hot: #FFE9C2; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--space); color: var(--ink);
    font: 400 1.0625rem/1.6 system-ui, sans-serif; padding: 24px 16px; overflow-x: hidden;
    background-image: radial-gradient(ellipse 70% 50% at 0% 0%, rgba(244,184,96,.10), transparent 70%); }
  main { max-width: 40rem; }
  .dial { width: 88px; height: 88px; border-radius: 50%; border: 1px solid rgba(232,228,216,.14); position: relative; margin-bottom: 40px; }
  .dial::before { content: ""; position: absolute; left: 50%; top: 50%; width: 46%; height: 2px; margin-top: -1px; transform-origin: 0 50%;
    transform: rotate(205deg); background: linear-gradient(90deg, var(--ink), transparent); opacity: .35; }
  .dial::after { content: ""; position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: #3a3833; }
  h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 400; font-size: clamp(2.8rem, 9vw, 5rem); line-height: .98; letter-spacing: -.02em; margin: 0 0 20px;
    background: linear-gradient(110deg, var(--hot), var(--ink) 40%, #77736B); -webkit-background-clip: text; background-clip: text; color: transparent; text-wrap: balance; }
  p { color: var(--dim); max-width: 34rem; margin: 0 0 28px; text-wrap: pretty; }
  a { display: inline-flex; background: var(--sun); color: var(--space); padding: .8rem 1.3rem; border-radius: 999px; text-decoration: none; font-weight: 500;
    transition: box-shadow .3s cubic-bezier(.16,1,.3,1), background .3s; }
  a:hover { background: var(--hot); box-shadow: 0 0 32px 4px rgba(244,184,96,.3); }
  a:focus-visible { outline: 2px solid var(--sun); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <div class="dial" aria-hidden="true"></div>
  <h1>This page is in permanent shadow.</h1>
  <p>Some crater floors at the south pole have not seen the Sun in two billion years. This address is one of them. The light is back on the main page.</p>
  <a href="/lunar-landing-site-navigator/">Back into the light</a>
</main>
</body>
</html>
