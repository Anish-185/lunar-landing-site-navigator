# conda env for the offline pipeline and the tests: everything in requirements.txt (the app) plus
# GDAL (for the vendored NASA MMGIS scripts), GeoPandas, Shapely, astroquery, Numba, joblib.
# Lives in pipeline/ so Streamlit Community Cloud (which prefers environment.yml at the root) only sees requirements.txt.
# Create with `make env`. Versions resolved from conda-forge on 2026-11-14.
name: lunar-nav
channels:
  - conda-forge
dependencies:
  - python=3.11
  # app (same pins as requirements.txt)
  - streamlit=1.67.0
  - plotly=7.1.0
  - numpy=2.4.6
  - pandas=3.1.1
  - pyarrow=26.0.1
  - scipy=1.17.1
  - spiceypy=8.4.0
  - skyfield=1.54
  - rasterio=1.4.4
  - pyproj=3.7.2
  - pyyaml=6.0.3
  # pipeline and tests only
  - gdal=3.12.3
  - geopandas=1.2.0
  - shapely=2.2.0
  - astroquery=0.4.11
  - numba=0.68.1
  - joblib=1.6.0
  - rioxarray=0.19.0
  - xarray=2026.9.0
  - pytest=9.2.0
  - pip
  - pip:
      - -e ..   # repo root (pip runs from this file's folder)
