# Gnomon theme (docs/design/CONCEPT.md, LOW LIGHT): space black base; colour carries meaning (Sun gold, Earth blue, terrain grey, fail red).
[server]
enableStaticServing = true
headless = true

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
base = "dark"
primaryColor = "#F4B860"
backgroundColor = "#05060B"
secondaryBackgroundColor = "#0B0D17"
textColor = "#EDEAE2"
linkColor = "#6FB1FF"
borderColor = "#2A2924"
font = "Geist, sans-serif"
headingFont = "Instrument Serif, serif"
codeFont = "Geist Mono, monospace"
headingFontWeights = 400
baseRadius = "0.75rem"
showWidgetBorder = true
chartCategoricalColors = ["#F4B860", "#6FB1FF", "#8C8A86", "#FF5C5C", "#9B85FF", "#6ED6B0"]

[[theme.fontFaces]]
family = "Geist"
url = "app/static/fonts/geist-latin-wght-normal.woff2"
weight = "100 900"

[[theme.fontFaces]]
family = "Geist Mono"
url = "app/static/fonts/geist-mono-latin-wght-normal.woff2"
weight = "100 900"

[[theme.fontFaces]]
family = "Instrument Serif"
url = "app/static/fonts/instrument-serif-latin-400-normal.woff2"
weight = 400

[theme.sidebar]
backgroundColor = "#0B0D17"
secondaryBackgroundColor = "#14151F"
